<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4d6b57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="日付メモ"><link rel="manifest" href="manifest.json"><title>日付メモ</title>
<style>:root{--bg:#f6f3ee;--card:#fff;--text:#272522;--muted:#777;--line:#ddd7cf;--accent:#4d6b57;--danger:#a44}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}header{padding:calc(16px + env(safe-area-inset-top)) 16px 12px;background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}h1{margin:0 0 10px;font-size:22px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}input,textarea,button,select{font:inherit}input,textarea,select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px}#keyword{flex:1;min-width:160px}.date{width:145px}button{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:white;font-weight:600}button.secondary{background:#e7e2db;color:var(--text)}button.danger{background:#f1dfdf;color:#8b3030}main{max-width:800px;margin:auto;padding:14px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:13px}label{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}.row{display:flex;gap:9px;flex-wrap:wrap}.row>div{flex:1;min-width:160px}textarea{width:100%;min-height:115px;resize:vertical}.wide{width:100%}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:7px}.note{white-space:pre-wrap;line-height:1.65}.tag{display:inline-block;background:#edf2ed;color:#4d6b57;border-radius:999px;padding:3px 8px;font-size:12px;margin:7px 5px 0 0}.thumb{width:100%;max-height:280px;object-fit:cover;border-radius:10px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:28px 10px}.year{font-size:21px;margin:22px 3px 8px}.month{font-size:16px;margin:12px 3px 7px;color:var(--accent)}.small{font-size:12px;color:var(--muted);line-height:1.5}.privacy{font-size:13px;line-height:1.6}.status{padding:9px 10px;background:#edf2ed;border-radius:9px;margin-top:9px;font-size:12px}@media(max-width:520px){.date,.row>div{width:100%;min-width:100%}button{padding:9px 11px}}</style></head>
<body><header><h1>日付メモ</h1><div class="toolbar"><input id="keyword" placeholder="キーワードで検索"><input id="from" class="date" type="date"><input id="to" class="date" type="date"><button class="secondary" onclick="clearSearch()">条件クリア</button></div></header><main>
<section class="panel"><h2 id="formTitle" style="font-size:18px;margin:0 0 11px">新しいメモ</h2><div class="row"><div><label>日付</label><input id="date" class="date" type="date"></div><div><label>キーワード（カンマ区切り）</label><input id="tags" class="wide" placeholder="例：旅行, 家族, 調べもの"></div></div><div style="margin-top:9px"><label>メモ</label><textarea id="text" placeholder="記録を入力してください"></textarea></div><div style="margin-top:9px"><label>写真（任意）</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"><div id="preview"></div></div><div class="actions"><button onclick="saveNote()">保存</button><button class="secondary" onclick="resetForm()">キャンセル</button></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0 0 9px">表示</h2><div class="toolbar"><select id="view" onchange="render()"><option value="timeline">日付順</option><option value="year">年別</option><option value="month">月別</option></select><select id="sort" onchange="render()"><option value="desc">新しい順</option><option value="asc">古い順</option></select></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0 0 9px">iPhone内バックアップ</h2><div class="privacy">このアプリは<strong>メモや写真を外部サーバーへ送信しません。</strong><br>バックアップもアプリからインターネット上へアップロードしません。</div><div class="actions"><button onclick="exportData()">バックアップを作成</button><button class="secondary" onclick="$('importFile').click()">バックアップから復元</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></div><div class="status" id="status">データ保存先：このiPhoneのブラウザ内</div><div class="status">アプリ版：5.0.0 ／ データ形式：v1（更新時も維持）</div><div class="actions"><button class="secondary" onclick="checkForUpdate()">アプリ更新を確認</button></div><p class="small">「バックアップを作成」を押すと、iPhoneの共有／保存画面から「ファイル」→「このiPhone内」などを選んで保存できます。アプリから自動的に外部へ送信することはありません。</p></section><div id="count" class="small" style="margin:8px 2px"></div><section id="list"></section></main>
<script>
const DB_NAME="DateMemoPrivateDB",DB_VERSION=1,STORE="notes";const APP_VERSION="5.0.0",SCHEMA_VERSION=1;let db,notes=[],editingId=null,photoData=null;const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);$("date").value=today();
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}function getAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(n){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).put(n);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function remove(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function refresh(){notes=await getAll();render()}
function previewPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photoData=r.result;$("preview").innerHTML=`<img class="thumb" src="${photoData}">`};r.readAsDataURL(f)}
async function saveNote(){const date=$("date").value||today(),text=$("text").value.trim(),tags=$("tags").value.split(",").map(x=>x.trim()).filter(Boolean);if(!text&&!photoData){alert("メモまたは写真を入力してください。");return}const old=editingId?notes.find(x=>x.id===editingId):null;const n={id:editingId||crypto.randomUUID(),date,text,tags,photo:photoData!==null?photoData:(old?.photo||""),createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};await put(n);resetForm();await refresh()}
function resetForm(){editingId=null;photoData=null;$("formTitle").textContent="新しいメモ";$("date").value=today();$("text").value="";$("tags").value="";$("photo").value="";$("preview").innerHTML=""}function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;editingId=id;photoData=n.photo||null;$("formTitle").textContent="メモを編集";$("date").value=n.date;$("text").value=n.text;$("tags").value=(n.tags||[]).join(", ");$("preview").innerHTML=n.photo?`<img class="thumb" src="${n.photo}">`:"";scrollTo({top:0,behavior:"smooth"})}async function deleteNote(id){if(!confirm("このメモを削除しますか？"))return;await remove(id);await refresh()}function clearSearch(){$("keyword").value="";$("from").value="";$("to").value="";render()}
function filtered(){const q=$("keyword").value.trim().toLowerCase(),from=$("from").value,to=$("to").value;let a=notes.filter(n=>{const hay=(n.text+" "+(n.tags||[]).join(" ")).toLowerCase();return(!q||hay.includes(q))&&(!from||n.date>=from)&&(!to||n.date<=to)});a.sort((x,y)=>$("sort").value==="asc"?x.date.localeCompare(y.date):y.date.localeCompare(x.date));return a}function esc(s){return(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function card(n){return `<article class="panel"><div class="meta"><strong>${esc(n.date)}</strong><span>${new Date(n.updatedAt||n.createdAt).toLocaleString("ja-JP")}</span></div>${n.photo?`<img class="thumb" src="${n.photo}">`:""}<div class="note">${esc(n.text)}</div><div>${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="actions"><button class="secondary" onclick="editNote('${n.id}')">編集</button><button class="danger" onclick="deleteNote('${n.id}')">削除</button></div></article>`}function render(){const a=filtered();$("count").textContent=`${a.length}件`;if(!a.length){$("list").innerHTML='<div class="empty">条件に合うメモはありません。</div>';return}if($("view").value==="timeline"){$("list").innerHTML=a.map(card).join("");return}const groups={};a.forEach(n=>{const k=$("view").value==="year"?n.date.slice(0,4):n.date.slice(0,7);(groups[k]??=[]).push(n)});const ks=Object.keys(groups).sort((a,b)=>$("sort").value==="asc"?a.localeCompare(b):b.localeCompare(a));$("list").innerHTML=ks.map(k=>`<div class="${$("view").value==="year"?"year":"month"}">${k}</div>${groups[k].map(card).join("")}`).join("")}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function exportData(){const all=await getAll();const payload={app:"日付メモ（完全ローカル版）",appVersion:APP_VERSION,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),notes:all};const blob=new Blob([JSON.stringify(payload)],{type:"application/json"});downloadBlob(blob,`日付メモ_バックアップ_${today()}.json`)}
async function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result),inc=Array.isArray(d)?d:d.notes;if(!Array.isArray(inc))throw 0;const clean=inc.filter(n=>n&&typeof n.date==="string").map(n=>({...n,id:n.id||crypto.randomUUID(),text:n.text||"",tags:Array.isArray(n.tags)?n.tags:[],photo:n.photo||"",createdAt:n.createdAt||Date.now(),updatedAt:n.updatedAt||Date.now()}));const replace=confirm(`${clean.length}件を読み込みます。\nOK：現在のメモを置き換える\nキャンセル：現在のメモに追加`);if(replace){const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}for(const n of clean)await put(n);await refresh();alert("復元しました。")}catch(_){alert("バックアップを読み込めませんでした。")}e.target.value=""};r.readAsText(f)}
$("keyword").addEventListener("input",render);$("from").addEventListener("change",render);$("to").addEventListener("change",render);openDB().then(async()=>{await refresh();try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(_){}}).catch(()=>alert("このブラウザではローカル保存を利用できません。"));let swReg=null;if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").then(reg=>{swReg=reg;reg.addEventListener("updatefound",()=>{const w=reg.installing;if(w)w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)$("status").textContent="新しいアプリ版があります。記録データはiPhone内に残ります。"})})}).catch(()=>{});async function checkForUpdate(){if(!swReg){alert("更新確認を利用できません。");return}try{await swReg.update();alert("アプリ本体の更新確認を行いました。メモ・写真は送信されません。")}catch(_){alert("更新確認ができませんでした。")}}
</script></body></html>
