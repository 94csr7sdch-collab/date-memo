</style></head><body><header><h1>日付メモ</h1><div class="toolbar"><input id="keyword" placeholder="キーワード・URLで検索"><input id="from" class="date" type="date"><input id="to" class="date" type="date"><button class="secondary" onclick="clearSearch()">条件クリア</button></div></header><main>
<section class="panel"><h2 id="formTitle" style="font-size:18px;margin:0 0 11px">新しいメモ</h2><div class="row"><div><label>日付</label><input id="date" class="date" type="date"></div><div><label>キーワード（カンマ区切り）</label><input id="tags" class="wide" placeholder="例：YouTube, 料理"></div></div><div style="margin-top:9px"><label>Webサイト・YouTubeのリンク（任意）</label><input id="url" class="wide" type="url" inputmode="url" placeholder="https://..."><div class="small">共有ショートカットでコピーしたURLは、この欄を長押ししてペーストできます。</div></div><div style="margin-top:9px"><label>メモ</label><textarea id="text" placeholder="記録を入力してください。入力に合わせて欄が広がります。画像をコピーして、この欄でペーストすることもできます。"></textarea><div id="preview"></div><div id="tableEditors"></div><div class="actions"><button type="button" class="secondary" onclick="insertTable()">表を挿入</button></div></div><div style="margin-top:9px"><label>写真（従来方式・任意）</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="previewPhoto(event)"></div><div class="actions"><button onclick="saveNote()">保存</button><button class="secondary" onclick="resetForm()">キャンセル</button></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0 0 9px">表示</h2><div class="toolbar"><select id="view" onchange="render()"><option value="timeline">日付順</option><option value="year">年別</option><option value="month">月別</option></select><select id="sort" onchange="render()"><option value="desc" selected>新しい順</option><option value="asc">古い順</option></select></div></section>
<section class="panel" id="transferPanel"><h2 style="font-size:17px;margin:0 0 9px">Safariとアプリのデータ統合</h2><div id="transferGuide" class="small"></div><div class="actions"><button id="transferExport" onclick="exportTransfer()">Safari側データを書き出す</button><button id="transferImport" class="secondary" onclick="$('mergeFile').click()">データを追加統合</button><input id="mergeFile" type="file" accept=".json,application/json" style="display:none" onchange="mergeData(event)"></div><div id="transferStatus" class="status"></div></section>
<section class="panel"><h2 style="font-size:17px;margin:0 0 9px">iPhone内バックアップ</h2><div class="small">メモ・写真・保存リンクは外部サーバーへ送信しません。バックアップも手動です。</div><div class="actions"><button onclick="exportData()">バックアップを作成</button><button class="secondary" onclick="$('importFile').click()">バックアップから復元</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></div><div class="status" id="status">データ保存先：このiPhone内（この画面専用）</div><div class="status">アプリ版：6.5.2 ／ データ形式：v1（既存データ維持）</div><div class="actions"><button class="secondary" onclick="checkForUpdate()">アプリ更新を確認</button></div></section><div id="count" class="small"></div><section id="list"></section></main><script>
const DB_NAME="DateMemoPrivateDB",DB_VERSION=1,STORE="notes",APP_VERSION="6.5.2",SCHEMA_VERSION=1;let db,notes=[],editingId=null,photoData=null,editTables=[];const $=id=>document.getElementById(id),today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$("date").value=today();const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function normalizeUrl(s){s=(s||"").trim();if(!s)return"";try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:""}catch{return""}}
function acceptSharedLink(){const p=new URLSearchParams(location.search),raw=p.get("share")||p.get("url")||"",u=normalizeUrl(raw);if(u){$("url").value=u;const title=(p.get("title")||"").trim();if(title&&!$("text").value)$("text").value=title;$("formTitle").textContent="共有リンクを保存";history.replaceState({},"",location.pathname);autoGrow();setTimeout(()=>$("url").scrollIntoView({behavior:"smooth",block:"center"}),100)}}acceptSharedLink();
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:"id"})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function getAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(n){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).put(n);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function remove(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readwrite").objectStore(STORE).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function autoGrow(){const t=$("text");t.style.height="auto";t.style.height=Math.max(110,t.scrollHeight)+"px"}$("text").addEventListener("input",autoGrow);
function setPhoto(data){photoData=data;$("preview").innerHTML=data?`<div class="imagebox"><img class="thumb" src="${data}" alt="貼り付け画像"><button type="button" class="danger" onclick="clearPhoto()">画像を削除</button></div>`:""}function clearPhoto(){photoData="";$("photo").value="";$("preview").innerHTML=""}function previewPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f)}
$("text").addEventListener("paste",e=>{const items=[...(e.clipboardData?.items||[])];const image=items.find(x=>x.type&&x.type.startsWith("image/"));if(!image)return;const f=image.getAsFile();if(!f)return;e.preventDefault();const r=new FileReader();r.onload=()=>setPhoto(r.result);r.readAsDataURL(f)});
function insertTable(){editTables.push([["項目1","項目2","項目3"],["","",""]]);renderTableEditors()}function syncTables(){document.querySelectorAll('.tableEditor').forEach((box,i)=>{editTables[i]=[...box.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('td')].map(td=>td.innerText))})}function addTableRow(i){syncTables();const cols=editTables[i]?.[0]?.length||3;editTables[i].push(Array(cols).fill(""));renderTableEditors()}function addTableCol(i){syncTables();editTables[i].forEach(r=>r.push(""));renderTableEditors()}function deleteTable(i){syncTables();if(confirm("この表を削除しますか？")){editTables.splice(i,1);renderTableEditors()}}function renderTableEditors(){$("tableEditors").innerHTML=editTables.map((t,i)=>`<div class="tableEditor"><div class="tableWrap"><table class="memoTable">${t.map(r=>`<tr>${r.map(c=>`<td contenteditable="true">${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div><div class="tableTools"><button type="button" class="secondary" onclick="addTableRow(${i})">行を追加</button><button type="button" class="secondary" onclick="addTableCol(${i})">列を追加</button><button type="button" class="danger" onclick="deleteTable(${i})">表を削除</button></div></div>`).join("")}
async function refresh(){notes=await getAll();render();updateTransferUI()}async function saveNote(){syncTables();const date=$("date").value||today(),text=$("text").value.trim(),tags=$("tags").value.split(",").map(x=>x.trim()).filter(Boolean),raw=$("url").value.trim(),url=normalizeUrl(raw);if(raw&&!url)return alert("有効なWebリンクを入力してください。");if(!text&&!photoData&&!url&&!editTables.length)return alert("メモ・画像・リンク・表のいずれかを入力してください。");const old=editingId?notes.find(x=>x.id===editingId):null;await put({id:editingId||crypto.randomUUID(),date,text,tags,url,photo:photoData!==null?photoData:(old?.photo||""),tables:editTables,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()});resetForm();await refresh()}
function resetForm(){editingId=null;photoData=null;editTables=[];$("formTitle").textContent="新しいメモ";$("date").value=today();$("text").value=$("tags").value=$("url").value="";$("photo").value="";$("preview").innerHTML="";$("tableEditors").innerHTML="";autoGrow()}function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;editingId=id;photoData=n.photo||null;editTables=JSON.parse(JSON.stringify(Array.isArray(n.tables)?n.tables:[]));$("formTitle").textContent="メモを編集";$("date").value=n.date;$("text").value=n.text||"";$("tags").value=(n.tags||[]).join(", ");$("url").value=n.url||"";setPhoto(n.photo||"");renderTableEditors();autoGrow();scrollTo({top:0,behavior:"smooth"})}async function deleteNote(id){if(confirm("このメモを削除しますか？")){await remove(id);await refresh()}}
function clearSearch(){$("keyword").value=$("from").value=$("to").value="";render()}function noteTime(n){const t=Number(n.updatedAt||n.createdAt||0);return Number.isFinite(t)?t:0}function filtered(){const q=$("keyword").value.trim().toLowerCase(),from=$("from").value,to=$("to").value;let a=notes.filter(n=>{const tableText=(n.tables||[]).flat(2).join(" "),hay=((n.text||"")+" "+(n.url||"")+" "+(n.tags||[]).join(" ")+" "+tableText).toLowerCase();return(!q||hay.includes(q))&&(!from||n.date>=from)&&(!to||n.date<=to)});a.sort((x,y)=>{const dir=$("sort").value==="asc"?1:-1;const byDate=x.date.localeCompare(y.date);if(byDate)return dir*byDate;const byTime=noteTime(x)-noteTime(y);if(byTime)return dir*byTime;return dir*String(x.id||"").localeCompare(String(y.id||""))});return a}function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function tableHtml(t){if(!Array.isArray(t)||!t.length)return"";return `<div class="tableWrap"><table class="memoTable">${t.map((r,ri)=>`<tr>${(r||[]).map(c=>ri===0?`<th>${esc(c)}</th>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</table></div>`}function tablesHtml(n){return (n.tables||[]).map(tableHtml).join("")}
function card(n){const u=normalizeUrl(n.url);return `<article class="panel"><div class="meta"><strong>${esc(n.date)}</strong><span>${new Date(n.updatedAt||n.createdAt).toLocaleString("ja-JP")}</span></div>${n.photo?`<img class="thumb" src="${n.photo}" alt="メモ画像">`:""}${u?`<a class="savedlink" href="${esc(u)}" target="_blank" rel="noopener noreferrer">🔗 ${esc(u)}</a>`:""}<div class="note">${esc(n.text)}</div>${tablesHtml(n)}<div>${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div><div class="actions"><button class="secondary" onclick="editNote('${n.id}')">編集</button><button class="share" onclick="shareNote('${n.id}')">共有</button><button class="secondary" onclick="printNote('${n.id}')">印刷</button><button class="danger" onclick="deleteNote('${n.id}')">削除</button></div></article>`}
function render(){const a=filtered();$("count").textContent=`${a.length}件`;if(!a.length){$("list").innerHTML='<div class="empty">条件に合うメモはありません。</div>';return}if($("view").value==="timeline"){$("list").innerHTML=a.map(card).join("");return}const g={};a.forEach(n=>{const k=$("view").value==="year"?n.date.slice(0,4):n.date.slice(0,7);(g[k]??=[]).push(n)});$("list").innerHTML=Object.keys(g).sort((a,b)=>$("sort").value==="asc"?a.localeCompare(b):b.localeCompare(a)).map(k=>`<div class="${$("view").value==="year"?"year":"month"}">${k}</div>${g[k].map(card).join("")}`).join("")}
function shareText(n){let s=`日付メモ\n${n.date}\n`;if(n.text)s+=`\n${n.text}\n`;if(n.url)s+=`\n${n.url}\n`;if((n.tags||[]).length)s+=`\nキーワード：${n.tags.join(", ")}\n`;if((n.tables||[]).length){s+="\n";(n.tables||[]).forEach(t=>{t.forEach(r=>s+=r.join("\t")+"\n");s+="\n"})}return s.trim()}async function shareNote(id){const n=notes.find(x=>x.id===id);if(!n)return;const data={title:`日付メモ ${n.date}`,text:shareText(n)};if(n.url)data.url=n.url;try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(data.text+(n.url?`\n${n.url}`:""));alert("共有内容をクリップボードにコピーしました。")}}catch(e){if(e?.name!=="AbortError")alert("共有できませんでした。")}}
function printNote(id){const n=notes.find(x=>x.id===id);if(!n)return;const w=window.open("","_blank");if(!w)return alert("印刷画面を開けませんでした。");const u=normalizeUrl(n.url);w.document.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>日付メモ ${esc(n.date)}</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222;margin:28px;line-height:1.65}.back{display:inline-block;border:0;border-radius:10px;padding:10px 14px;margin:0 0 18px;background:#4d6b57;color:#fff;font:inherit;font-weight:600}h1{font-size:20px}img{max-width:100%;max-height:70vh;object-fit:contain}a{color:#315f42;overflow-wrap:anywhere}.note{white-space:pre-wrap}.memoTable{border-collapse:collapse;width:100%;margin:14px 0}.memoTable td,.memoTable th{border:1px solid #888;padding:8px;text-align:left;vertical-align:top}.memoTable th{background:#eee}.tags{margin-top:12px;color:#666}@media print{.back{display:none}}</style></head><body><button class="back" onclick="window.close()">← 日付メモに戻る</button><h1>日付メモ　${esc(n.date)}</h1>${n.photo?`<img src="${n.photo}" alt="メモ画像">`:""}${u?`<p><a href="${esc(u)}">${esc(u)}</a></p>`:""}<div class="note">${esc(n.text)}</div>${tablesHtml(n)}${(n.tags||[]).length?`<div class="tags">キーワード：${(n.tags||[]).map(esc).join("、")}</div>`:""}<script>window.onload=()=>setTimeout(()=>window.print(),250);window.addEventListener("afterprint",()=>{document.querySelector(".back")?.focus()})<\/script></body></html>`);w.document.close()}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function packageData(kind){return getAll().then(data=>({app:"日付メモ（完全ローカル版）",kind,appVersion:APP_VERSION,schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),notes:data}))}async function exportData(){const d=await packageData("backup");downloadBlob(new Blob([JSON.stringify(d)],{type:"application/json"}),`日付メモ_バックアップ_${today()}.json`)}async function exportTransfer(){const d=await packageData("transfer");downloadBlob(new Blob([JSON.stringify(d)],{type:"application/json"}),`日付メモ_Safari移行_${today()}.json`);alert(`${d.notes.length}件を書き出しました。ファイルは削除せず、ホーム画面の「日付メモ」で「データを追加統合」を押してください。`)}
function cleanIncoming(d){const inc=Array.isArray(d)?d:d.notes;if(!Array.isArray(inc))throw new Error();return inc.filter(n=>n&&typeof n.date==="string").map(n=>({...n,id:n.id||crypto.randomUUID(),text:n.text||"",url:normalizeUrl(n.url),tags:Array.isArray(n.tags)?n.tags:[],photo:n.photo||"",tables:Array.isArray(n.tables)?n.tables:[],createdAt:n.createdAt||Date.now(),updatedAt:n.updatedAt||Date.now()}))}function signature(n){return [n.date||"",n.text||"",n.url||"",(n.tags||[]).join("|"),n.photo||"",JSON.stringify(n.tables||[])].join("\u241f")}
async function mergeData(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),clean=cleanIncoming(d),existing=await getAll(),ids=new Set(existing.map(n=>n.id)),sigs=new Set(existing.map(signature));let added=0,skipped=0;for(const n of clean){if(ids.has(n.id)||sigs.has(signature(n))){skipped++;continue}await put(n);ids.add(n.id);sigs.add(signature(n));added++}await refresh();alert(`統合完了：${added}件を追加しました。${skipped?`\n重複 ${skipped}件は追加していません。`:""}\n既存データは削除していません。`)}catch{alert("移行ファイルを読み込めませんでした。既存データは変更していません。") }e.target.value=""}
async function importData(e){const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),clean=cleanIncoming(d);if(!confirm(`${clean.length}件のバックアップを復元します。\n現在のデータは置き換えられます。\n続けますか？`)){e.target.value="";return}const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).clear();await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=rej});for(const n of clean)await put(n);await refresh();alert("復元しました。") }catch{alert("バックアップを読み込めませんでした。") }e.target.value=""}
function updateTransferUI(){const app=isStandalone();$("transferExport").style.display=app?"none":"inline-block";$("transferImport").style.display=app?"inline-block":"none";$("transferGuide").textContent=app?"ここが正式な保存先です。Safari側のデータを書き出したファイルを、ここへ追加統合できます。既存メモは消しません。":"Safari側のデータが表示されています。まず移行ファイルを書き出してください。その後、ホーム画面の「日付メモ」を開いて追加統合します。";$("transferStatus").textContent=(app?"ホーム画面アプリ側":"Safari側")+`：現在 ${notes.length}件`}
$("keyword").addEventListener("input",render);$("from").addEventListener("change",render);$("to").addEventListener("change",render);openDB().then(refresh).catch(()=>alert("ローカル保存を利用できません。"));let swReg=null;if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").then(r=>swReg=r).catch(()=>{});async function checkForUpdate(){if(!swReg)return alert("更新確認を利用できません。");try{await swReg.update();alert("アプリ本体の更新確認を行いました。記録データは送信されません。") }catch{alert("更新確認ができませんでした。")}}
autoGrow();
</script></body></html>
